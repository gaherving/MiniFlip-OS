name: Build exact ZH1 payload candidate

on:
  push:
    branches: [tmp-galaxy-root-checker]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Android NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;28.2.13676358"

      - name: Clone payload source
        run: |
          git clone --depth 1 https://github.com/igorcv88/Root-My-Galaxy-Payloads-Extended.git payload

      - name: Create exact ZH1 target
        run: |
          set -eux
          cp -a payload/src/targets/pa3q-S938BXXSBCZG3 payload/src/targets/pa3q-S938BXXSCCZH1
          sed -i 's/pa3q-S938BXXSBCZG3/pa3q-S938BXXSCCZH1/g' payload/src/targets/pa3q-S938BXXSCCZH1/target.h
          sed -i 's/S938BXXSBCZG3_OXMBCZG3/S938BXXSCCZH1_OWOCCZH1/g' payload/src/targets/pa3q-S938BXXSCCZH1/target.h
          grep -n "BUILD_VARIANT\|BUILD_FINGERPRINT\|P0_FINGERPRINT_HEADER" payload/src/targets/pa3q-S938BXXSCCZH1/target.h

      - name: Build exploit and root helper
        working-directory: payload
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang"
          make TARGET=pa3q-S938BXXSCCZH1 all
          mkdir -p ../out
          cp build/pa3q-S938BXXSCCZH1/cve-2026-43499-app.so ../out/
          cp build/pa3q-S938BXXSCCZH1/cve-2026-43499-root ../out/
          sha256sum ../out/*

      - name: Clone KernelSU v3.3.0
        run: |
          git clone --depth 1 --branch v3.3.0 https://github.com/tiann/KernelSU.git kernelsu-src
          cp payload/kernelsu/patches/KernelSU-v3.3.0-samsung-kdp-rkp-defex.patch kernelsu-src/
          cd kernelsu-src
          git apply KernelSU-v3.3.0-samsung-kdp-rkp-defex.patch

      - name: Build exact-release KernelSU module
        run: |
          set -eux
          docker run --rm             -v "$PWD/kernelsu-src:/workspace"             -w /workspace/kernel             ghcr.io/ylarod/ddk-min:android15-6.6-20260828             bash -lc '
              set -eux
              RELEASE="6.6.98-android15-8-pd6ff1cd-abogkiS938BXXSCCZH1-4k"
              printf "%s\n" "$RELEASE" > "$KDIR/include/config/kernel.release"
              printf "#define UTS_RELEASE \"%s\"\n" "$RELEASE" > "$KDIR/include/generated/utsrelease.h"
              make clean || true
              CONFIG_KSU=m               CONFIG_KSU_SAMSUNG_KDP=y               CONFIG_KSU_SAMSUNG_RKP=y               CONFIG_KSU_SAMSUNG_DEFEX=y               CONFIG_KSU_SAMSUNG_NO_PATCH_TEXT=y               CC=clang make -j"$(nproc)"
              modinfo ./kernelsu.ko | grep vermagic
              llvm-strip -d ./kernelsu.ko
            '
          cp kernelsu-src/kernel/kernelsu.ko out/android15-6.6_kernelsu-S938BXXSCCZH1-kdp-v3.3.0.ko

      - name: Build exact late-load wrapper
        run: |
          set -eux
          mkdir -p exact-loader/src exact-loader/assets
          cp out/android15-6.6_kernelsu-S938BXXSCCZH1-kdp-v3.3.0.ko exact-loader/assets/kernelsu.ko
          curl -L --fail --retry 3             -o exact-loader/assets/ksud-real             https://raw.githubusercontent.com/igorcv88/Root-My-Galaxy-Payloads-Extended/main/kernelsu/ksud-s25u-kdp-v3.3.0

          cp -a kernelsu-src/userspace/ksuinit exact-loader/ksuinit
          python3 - <<'PY'
          from pathlib import Path
          p=Path("exact-loader/ksuinit/Cargo.toml")
          s=p.read_text()
          s=s.replace("edition.workspace = true", 'edition = "2024"')
          s=s.replace("anyhow.workspace = true", 'anyhow = "1"')
          s=s.replace("log.workspace = true", 'log = "0.4"')
          s=s.replace('rustix = { git = "https://github.com/KernelSU2/rustix.git", rev = "4a53fbc", features = ["mount", "fs", "runtime", "system", "process"] }',
                      'rustix = { version = "1.1.2", features = ["mount", "fs", "runtime", "system", "process"] }')
          p.write_text(s)
          PY

          cat > exact-loader/Cargo.toml <<'EOF'
          [package]
          name = "ksud-zh1-wrapper"
          version = "1.0.0"
          edition = "2024"

          [dependencies]
          anyhow = "1"
          ksuinit = { path = "ksuinit" }

          [profile.release]
          strip = true
          lto = true
          opt-level = "z"
          panic = "abort"

          [patch.crates-io]
          libc = { git = "https://github.com/rust-lang/libc", rev = "1a661633f11a261ff9c00b40875ef72f1cbec818" }
          EOF

          cat > exact-loader/src/main.rs <<'EOF'
          use anyhow::{Context, Result};
          use std::ffi::CString;
          use std::fs;
          use std::os::unix::fs::PermissionsExt;
          use std::os::unix::process::CommandExt;
          use std::process::Command;

          static MODULE: &[u8] = include_bytes!("../assets/kernelsu.ko");
          static KSUD_REAL: &[u8] = include_bytes!("../assets/ksud-real");

          fn main() -> Result<()> {
              let args: Vec<String> = std::env::args().skip(1).collect();
              let real = "/data/local/tmp/.ksud-zh1-real";

              // Stage the real ksud before loading the module because Samsung
              // DEFEX/KDP can restrict writes after the security context changes.
              fs::write(real, KSUD_REAL).context("stage ksud-real")?;
              fs::set_permissions(real, fs::Permissions::from_mode(0o755))
                  .context("chmod ksud-real")?;

              if !ksuinit::has_kernelsu() {
                  let params = CString::new("allow_shell=1")?;
                  ksuinit::load_module(MODULE, &params)
                      .context("load exact ZH1 KernelSU module")?;
              }

              let err = Command::new(real).args(&args).exec();
              Err(anyhow::anyhow!("exec ksud-real failed: {err}"))
          }
          EOF

          rustup target add aarch64-linux-android
          NDK="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          TOOL="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$TOOL:$PATH"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOL/aarch64-linux-android35-clang"
          export CC_aarch64_linux_android="$TOOL/aarch64-linux-android35-clang"
          export AR_aarch64_linux_android="$TOOL/llvm-ar"
          export CARGO_NET_GIT_FETCH_WITH_CLI=true
          cargo build --manifest-path exact-loader/Cargo.toml --release --target aarch64-linux-android
          cp exact-loader/target/aarch64-linux-android/release/ksud-zh1-wrapper              out/ksud-S938BXXSCCZH1-kdp-v3.3.0
          chmod +x out/ksud-S938BXXSCCZH1-kdp-v3.3.0
          file out/ksud-S938BXXSCCZH1-kdp-v3.3.0
          sha256sum out/ksud-S938BXXSCCZH1-kdp-v3.3.0

      - name: Write exact profile metadata
        run: |
          python3 - <<'PY'
          import json, hashlib, os
          files = {}
          for n in os.listdir("out"):
              p=os.path.join("out",n)
              if os.path.isfile(p):
                  h=hashlib.sha256(open(p,"rb").read()).hexdigest()
                  files[n]={"size":os.path.getsize(p),"sha256":h}
          profile={
            "payloadId":"pa3q-S938BXXSCCZH1-candidate-v1",
            "device":"SM-S938B",
            "codename":"pa3q",
            "buildDisplay":"BP4A.251205.006.S938BXXSCCZH1",
            "firmware":"S938BXXSCCZH1",
            "android":16,
            "sdk":36,
            "abi":"arm64-v8a",
            "pageSize":4096,
            "kernelRelease":"6.6.98-android15-8-pd6ff1cd-abogkiS938BXXSCCZH1-4k",
            "kmi":"android15-6.6",
            "sourceBase":"pd6ff1cd",
            "derivedFrom":"pa3q-S938BXXSBCZG3",
            "status":"candidate-unverified-on-hardware",
            "files":files
          }
          open("out/profile-S938BXXSCCZH1.json","w").write(json.dumps(profile,indent=2)+"\n")
          PY
          sha256sum out/* > out/SHA256SUMS.txt
          cat out/profile-S938BXXSCCZH1.json

      - name: Package
        run: |
          cd out
          zip -9 ../S938BXXSCCZH1-exact-payload-candidate-v1.zip *
          cd ..
          sha256sum S938BXXSCCZH1-exact-payload-candidate-v1.zip

      - uses: actions/upload-artifact@v4
        with:
          name: S938BXXSCCZH1-exact-payload-candidate-v1
          path: S938BXXSCCZH1-exact-payload-candidate-v1.zip
          if-no-files-found: error
