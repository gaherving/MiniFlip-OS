name: Galaxy Root Checker APK
on:
  push:
    branches: [tmp-galaxy-root-checker]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: rootchecker
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GalaxyRootChecker-APK
          path: rootchecker/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
