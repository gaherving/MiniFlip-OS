name: Anastasia Neural v5.4
on:
  workflow_dispatch:
  push:
    branches: [anastasia-neural-v54]
    paths:
      - 'anastasia-neural/**'
      - '.github/workflows/anastasia-neural-v54.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK/NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.14206865" "cmake;3.22.1"
      - name: Get llama.cpp
        working-directory: anastasia-neural
        run: git clone --depth 1 https://github.com/ggml-org/llama.cpp.git app/src/main/cpp/llama.cpp
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK
        working-directory: anastasia-neural
        run: gradle :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Anastasia-Neural-v5.4-unsigned
          path: anastasia-neural/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
