name: Galaxy Root Checker v0.3 Root Engine
on:
  push:
    branches: [tmp-galaxy-root-checker]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Clone upstream root engine
        run: |
          git clone --depth 1 https://github.com/BuSung-dev/Root-My-Galaxy.git upstream-root
      - name: Adapt SDK for CI
        run: |
          grep -RIl "compileSdk = 37\|compileSdk 37\|targetSdk = 37\|targetSdk 37" upstream-root/app upstream-root/build.gradle.kts upstream-root/settings.gradle.kts 2>/dev/null | while read f; do
            sed -i 's/compileSdk = 37/compileSdk = 36/g; s/compileSdk 37/compileSdk 36/g; s/targetSdk = 37/targetSdk = 36/g; s/targetSdk 37/targetSdk 36/g' "$f"
          done
      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Build functional APK
        working-directory: upstream-root
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GalaxyRootChecker-v0.3
          path: upstream-root/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
