name: Galaxy Root Checker v0.3 Root Engine
on:
  push:
    branches: [tmp-galaxy-root-checker]
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download tested upstream root engine
        run: |
          curl -L --fail --retry 3 -o GalaxyRootChecker-v0.3.apk "https://github.com/BuSung-dev/Root-My-Galaxy/releases/download/v0.2.65/app-debug.apk"
          sha256sum GalaxyRootChecker-v0.3.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GalaxyRootChecker-v0.3
          path: GalaxyRootChecker-v0.3.apk
          if-no-files-found: error
