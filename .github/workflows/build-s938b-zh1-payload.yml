name: Build S938B ZH1 Candidate Payload
on:
  push:
    branches: [tmp-galaxy-root-checker]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Android NDK r29
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;29.0.14206865"
      - name: Clone payload source
        run: git clone --depth 1 https://github.com/BuSung-dev/Root-My-Galaxy-Payloads.git payloads
      - name: Create exact-build candidate profile
        run: |
          mkdir -p payloads/src/targets/pa3q-S938BXXSCCZH1
          cp payloads/src/targets/pa3q-S938NKSUACZF1/target.h payloads/src/targets/pa3q-S938BXXSCCZH1/target.h
          cp payloads/src/targets/pa3q-S938NKSUACZF1/p0_fingerprint.h payloads/src/targets/pa3q-S938BXXSCCZH1/p0_fingerprint.h
          sed -i 's/pa3q-S938NKSUACZF1/pa3q-S938BXXSCCZH1/g' payloads/src/targets/pa3q-S938BXXSCCZH1/target.h
          sed -i 's#samsung/pa3qksx/pa3q:16/BP4A.251205.006/S938NKSUACZF1_OKRACZF1:user/release-keys#samsung/pa3qxxx/pa3q:16/BP4A.251205.006/S938BXXSCCZH1:user/release-keys#g' payloads/src/targets/pa3q-S938BXXSCCZH1/target.h
          grep -n 'BUILD_VARIANT_LABEL\|BUILD_FINGERPRINT\|P0_FINGERPRINT_HEADER' payloads/src/targets/pa3q-S938BXXSCCZH1/target.h
      - name: Build candidate payload
        working-directory: payloads
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/29.0.14206865
        run: |
          make TARGET=pa3q-S938BXXSCCZH1 ANDROID_NDK_HOME="$ANDROID_NDK_HOME" release
          sha256sum build/pa3q-S938BXXSCCZH1/cve-2026-43499-app.so
      - uses: actions/upload-artifact@v4
        with:
          name: S938BXXSCCZH1-candidate-payload
          path: |
            payloads/build/pa3q-S938BXXSCCZH1/cve-2026-43499-app.so
            payloads/build/pa3q-S938BXXSCCZH1/cve-2026-43499-root
            payloads/src/targets/pa3q-S938BXXSCCZH1/target.h
            payloads/src/targets/pa3q-S938BXXSCCZH1/p0_fingerprint.h
          if-no-files-found: error
